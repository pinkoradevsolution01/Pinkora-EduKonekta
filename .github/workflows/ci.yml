name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edukonekta
          POSTGRES_PASSWORD: edukonekta
          POSTGRES_DB: edukonekta
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edukonekta -d edukonekta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://edukonekta:edukonekta@localhost:5432/edukonekta?schema=public
      CORS_ORIGIN: http://localhost:3000
      PORT: 4000
      API_PREFIX: api
      API_VERSION: v1
      LOG_LEVEL: warn
      RUN_DB_TESTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run prisma:generate --workspace=@pinkora/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run prisma:seed --workspace=@pinkora/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:shared
      - run: npm run build:api
      - run: npm run build:web
      - name: Verify API health against PostgreSQL
        shell: bash
        run: |
          npm run start --workspace=@pinkora/api > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if response=$(curl --silent --show-error --fail http://localhost:4000/api/v1/health); then
              echo "$response"
              echo "$response" | grep -q '"status":"ok"'
              echo "$response" | grep -q '"database":"up"'
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1
      - name: Run Playwright smoke test
        shell: bash
        run: |
          npm run start --workspace=@pinkora/web > web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://localhost:3000/api/health; then
              break
            fi
            sleep 2
          done
          npx playwright install --with-deps chromium
          npm run test:e2e
