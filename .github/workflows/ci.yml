name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edukonekta
          POSTGRES_PASSWORD: edukonekta
          POSTGRES_DB: edukonekta
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edukonekta -d edukonekta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://edukonekta:edukonekta@localhost:5432/edukonekta?schema=public
      CORS_ORIGIN: http://localhost:3000
      PORT: 4000
      API_PREFIX: api
      API_VERSION: v1
      LOG_LEVEL: warn
      RUN_DB_TESTS: true
      # Browser calls stay same-origin; Next rewrites this path to the locally
      # started API during the Playwright job.
      NEXT_PUBLIC_API_URL: /api/v1
      API_INTERNAL_URL: http://127.0.0.1:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run prisma:generate --workspace=@pinkora/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run prisma:seed --workspace=@pinkora/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:shared
      - run: npm run build:api
      - run: NODE_ENV=production npm run build:web
      - name: Verify API health against PostgreSQL
        shell: bash
        run: |
          npm run start --workspace=@pinkora/api > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if response=$(curl --silent --show-error --fail http://localhost:4000/api/v1/health); then
              echo "$response"
              echo "$response" | grep -q '"status":"ok"'
              echo "$response" | grep -q '"database":"up"'
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1
      - name: Run Playwright smoke test
        shell: bash
        run: |
          npm run start --workspace=@pinkora/api > api-e2e.log 2>&1 &
          api_pid=$!
          NODE_ENV=production npm run start --workspace=@pinkora/web -- --hostname 127.0.0.1 > web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://localhost:4000/api/v1/health >/dev/null && \
              curl --silent --show-error --fail http://localhost:3000/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo 'API or web server did not become ready.'
            cat api-e2e.log || true
            cat web.log || true
            exit 1
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
